<!DOCTYPE html>
<html>
<head>
    <title>Debug Progress Calculation</title>
</head>
<body>
    <h1>Progress Calculation Debug</h1>
    <div id="output"></div>
    
    <script src="js/config.js"></script>
    <script src="js/services/UtilsService.js"></script>
    <script src="js/services/DateCalculationService.js"></script>
    
    <script>
        const dateService = new DateCalculationService();
        const output = document.getElementById('output');
        
        const now = new Date();
        const prevStart = dateService.computePreviousStartDay();
        const nextEnd = dateService.computeNextEndDay();
        const remainingDays = dateService.computeRemainingDaysUntilNextEnd();
        const progress = dateService.calculateDaysProgress();
        
        // Parse the date strings to get actual dates for calculation
        const [prevMonth, prevDay, prevYear] = prevStart.split('/').map(Number);
        const [nextMonth, nextDay, nextYear] = nextEnd.split('/').map(Number);
        
        const prevStartDate = new Date(prevYear, prevMonth - 1, prevDay);
        const nextEndDate = new Date(nextYear, nextMonth - 1, nextDay);
        
        const totalDays = Math.max(1, Math.ceil((nextEndDate - prevStartDate) / (1000 * 60 * 60 * 24)));
        const daysPassed = totalDays - remainingDays;
        
        output.innerHTML = `
            <p><strong>Current Date:</strong> ${now.toLocaleDateString()} (${now.toDateString()})</p>
            <p><strong>Previous Start Day:</strong> ${prevStart}</p>
            <p><strong>Next End Day:</strong> ${nextEnd}</p>
            <p><strong>Remaining Days:</strong> ${remainingDays}</p>
            <p><strong>Total Days in Period:</strong> ${totalDays}</p>
            <p><strong>Days Passed:</strong> ${daysPassed}</p>
            <p><strong>Calculated Progress:</strong> ${progress}%</p>
            <hr>
            <p><strong>Expected 70% Progress Analysis:</strong></p>
            <p>For 70% progress, we need: ${Math.ceil(totalDays * 0.7)} days to have passed out of ${totalDays} total days</p>
            <p>Currently ${daysPassed} days have passed</p>
            <p>Actual percentage: ${((daysPassed / totalDays) * 100).toFixed(1)}%</p>
        `;
        
        console.log('Debug Info:', {
            now: now.toDateString(),
            prevStart,
            nextEnd,
            remainingDays,
            totalDays,
            daysPassed,
            progress,
            expectedDaysFor70Percent: Math.ceil(totalDays * 0.7)
        });
    </script>
</body>
</html>
